[package]
name = "openair-capture"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
openair-core = { path = "../core" }
cpal.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Core Audio for --handoff: device enumeration, endpoint volume, and the
# undocumented IPolicyConfig (default-device switching, needs `implement` for
# the #[interface] macro). 0.54 is already in the lockfile via cpal, so this
# adds no new major version.
windows = { version = "0.54", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }
