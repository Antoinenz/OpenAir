[package]
name = "openair-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
# Interface enumeration, so we can bind to the interface that actually reaches
# the receiver instead of trusting the routing table. Already in the tree via
# mdns-sd, so this adds no new dependency.
if-addrs = "0.13"
# Bind-before-connect, which std::net::TcpStream doesn't expose.
socket2 = "0.5"
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# MMCSS ("Pro Audio" thread scheduling) for the sender thread, and the registry
# read that tells us whether Windows is honouring our DSCP marking. 0.54 is
# already in the lockfile via cpal, so this adds no new major version.
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }
