# Build a Windows binary and attach it to a GitHub release.
#
# Scope is deliberately small: a portable zip, nothing else. No installer, no
# code signing, no winget or Scoop manifest. Those belong to a real launch and
# each carries its own decisions (SignPath enrolment, WiX vs NSIS, manifest
# review queues); a prerelease should not pretend to have made them.
#
# Triggered by a tag so the released bytes are tied to a commit you can name.
name: Release

on:
  push:
    tags: ["v*"]
  # So the packaging can be proven before a tag exists. Runs produce an
  # artifact but no release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Tests gate the release too. A tag that ships a red build is worse than
      # a tag that never happened.
      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p openair-cli

      # Proves the thing we are about to ship actually starts. Catches a
      # missing runtime DLL or a link error that a successful compile hides.
      - name: Smoke test the binary
        run: ./target/release/openair.exe --help

      - name: Stage the package
        shell: bash
        run: |
          set -euo pipefail
          # A tag gives the version; a manual run is labelled by commit so the
          # two can never be confused for each other.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

          dir="openair-${version}-windows-x64"
          mkdir -p "staging/${dir}"
          cp target/release/openair.exe "staging/${dir}/"
          cp README.md LICENSE "staging/${dir}/"
          cp -r docs "staging/${dir}/docs"
          cp packaging/FIRST-RUN.txt "staging/${dir}/"

          cd staging
          7z a -tzip "../${dir}.zip" "${dir}" >/dev/null
          echo "ASSET=${dir}.zip" >> "${GITHUB_ENV}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          # Every v0.x tag is a prerelease: there is no desktop UI yet and the
          # binary is unsigned. Flip this when 1.0 is actually meant.
          prerelease: true
          generate_release_notes: true
